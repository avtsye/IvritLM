name: IvritLM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned project test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-intake.txt -r requirements-model.txt
      - name: Compile Python package and scripts
        run: python -m compileall -q ivritlm scripts tests
      - name: Run model unit tests
        run: python -m pytest -q
      - name: Validate dashboard files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
      - name: Validate JavaScript syntax
        run: node --check site/app.js
