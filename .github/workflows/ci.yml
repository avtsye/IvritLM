name: IvritLM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install intake dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-intake.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts
      - name: Validate dashboard files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
      - name: Validate JavaScript syntax
        run: node --check site/app.js
