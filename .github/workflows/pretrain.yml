name: IvritLM - Pretraining

on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: Path to an approved UTF-8 .txt corpus already committed to this repository
        required: true
        type: string
      steps:
        description: Number of optimizer steps (bounded CPU experiment)
        required: true
        default: "100"
        type: string
      batch_size:
        description: Batch size
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: ivritlm-pretraining
  cancel-in-progress: false

jobs:
  pretrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-model.txt
      - name: Validate bounded run settings and corpus path
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
          STEPS: ${{ inputs.steps }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          steps = int(os.environ["STEPS"])
          batch = int(os.environ["BATCH_SIZE"])
          path = Path(os.environ["CORPUS_PATH"]).resolve()
          root = Path.cwd().resolve()
          if not 1 <= steps <= 1000:
              raise SystemExit("steps must be between 1 and 1000 on the hosted CPU runner")
          if not 1 <= batch <= 16:
              raise SystemExit("batch_size must be between 1 and 16")
          if root not in path.parents or path.suffix.lower() != ".txt" or not path.is_file():
              raise SystemExit("corpus_path must point to an existing .txt file inside the repository")
          print(f"Using approved-corpus path: {path.relative_to(root)}")
          PY
      - name: Train from random initialization
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
          STEPS: ${{ inputs.steps }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: python scripts/train.py --corpus "$CORPUS_PATH" --steps "$STEPS" --batch-size "$BATCH_SIZE" --output artifacts/pretraining
      - name: Upload checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: ivritlm-checkpoint-${{ github.run_id }}
          path: artifacts/pretraining/
          if-no-files-found: error
          retention-days: 14
