name: IvritLM - Incremental Pretraining and GGUF Export

on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: Optional repository TXT path; leave empty to use the latest corpus saved in Drive
        required: false
        default: ""
        type: string
      data_approved:
        description: Confirm that source rights and the corpus content have been reviewed
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      steps:
        description: Additional optimizer steps for this run (hosted CPU limit)
        required: true
        default: "100"
        type: string
      batch_size:
        description: Batch size
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: ivritlm-model-training
  cancel-in-progress: false

jobs:
  pretrain:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 120
    steps:
      - name: Checkout IvritLM
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp converter
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 15fcfc7357f8de73671d39e7d8c594e1beb3052d
          path: llama.cpp
          persist-credentials: false

      - name: Apply IvritLM tokenizer compatibility patch
        run: python scripts/patch_llama_cpp.py --converter-root llama.cpp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install IvritLM dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-model.txt
          python -m pip install --disable-pip-version-check -r requirements-drive.txt

      - name: Install GGUF conversion dependencies
        run: python -m pip install --disable-pip-version-check "gguf>=0.1.0" "transformers==4.57.6" "sentencepiece>=0.1.98,<0.3.0" "protobuf>=4.21.0,<5.0.0"

      - name: Validate Drive configuration and run settings
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          CORPUS_PATH: ${{ inputs.corpus_path }}
          STEPS: ${{ inputs.steps }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DATA_APPROVED: ${{ inputs.data_approved }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          if os.environ.get("DATA_APPROVED") != "yes":
              raise SystemExit("Review the source rights and corpus contents before training.")
          required = ["DRIVE_CLIENT_ID", "DRIVE_CLIENT_SECRET", "DRIVE_REFRESH_TOKEN", "DRIVE_FOLDER_ID"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Configure these repository secrets before training: " + ", ".join(missing))
          steps = int(os.environ["STEPS"])
          batch = int(os.environ["BATCH_SIZE"])
          corpus_value = os.environ.get("CORPUS_PATH", "").strip()
          if not 1 <= steps <= 1000:
              raise SystemExit("steps must be between 1 and 1000 on the hosted CPU runner")
          if not 1 <= batch <= 16:
              raise SystemExit("batch_size must be between 1 and 16")
          if corpus_value:
              path = Path(corpus_value).resolve()
              root = Path.cwd().resolve()
              if root not in path.parents or path.suffix.lower() != ".txt" or not path.is_file():
                  raise SystemExit("corpus_path must point to an existing .txt file inside the repository")
              print(f"Validated repository corpus path: {path.relative_to(root)}")
          else:
              print("No repository corpus supplied; latest corpus will be restored from Google Drive.")
          PY

      - name: Restore the latest checkpoint from Google Drive
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/drive_storage.py download-checkpoint

      - name: Restore latest corpus from Google Drive when no path was supplied
        if: ${{ inputs.corpus_path == '' }}
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/drive_storage.py download-corpus

      - name: Continue training from previous weights and optimizer state
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
          STEPS: ${{ inputs.steps }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          if [ -z "$CORPUS_PATH" ]; then CORPUS_PATH="artifacts/pretraining/corpus.txt"; fi
          RESUME_ARGS=()
          if [ -f artifacts/pretraining/checkpoint.pt ]; then
            RESUME_ARGS=(--resume artifacts/pretraining/checkpoint.pt)
          else
            echo "No prior checkpoint exists; starting from randomly initialized weights."
          fi
          python scripts/train.py \
            --corpus "$CORPUS_PATH" \
            --steps "$STEPS" \
            --batch-size "$BATCH_SIZE" \
            --output artifacts/pretraining \
            "${RESUME_ARGS[@]}"

      - name: Persist the new checkpoint to Google Drive
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/drive_storage.py upload-checkpoint

      - name: Export checkpoint to Hugging Face GPT-2-compatible format
        run: python scripts/export_hf.py --checkpoint artifacts/pretraining/checkpoint.pt --output artifacts/hf-export

      - name: Convert model to GGUF
        run: |
          python llama.cpp/convert_hf_to_gguf.py artifacts/hf-export \
            --outfile artifacts/pretraining/model.gguf \
            --outtype f16
          python - <<'PY'
          from pathlib import Path
          model = Path("artifacts/pretraining/model.gguf")
          if not model.is_file() or model.stat().st_size < 1024:
              raise SystemExit("GGUF output is missing or unexpectedly small")
          if model.open("rb").read(4) != b"GGUF":
              raise SystemExit("Output file does not have the GGUF magic header")
          print(f"GGUF validated: {model.stat().st_size} bytes")
          PY

      - name: Upload GGUF model and metrics to Google Drive
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/drive_storage.py upload-model

      - name: Upload run artifacts to GitHub Actions as a secondary copy
        uses: actions/upload-artifact@v4
        with:
          name: ivritlm-run-${{ github.run_id }}
          path: |
            artifacts/pretraining/checkpoint.pt
            artifacts/pretraining/model.gguf
            artifacts/pretraining/tokenizer.json
            artifacts/pretraining/metrics.json
            artifacts/pretraining/run-manifest.json
          if-no-files-found: error
          retention-days: 14
