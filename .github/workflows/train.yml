name: IvritLM - Source intake and Hebrew corpus

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public HTTPS URL (GitHub repository or web page)
        required: true
        type: string
      source_kind:
        description: Source type
        required: true
        type: choice
        options:
          - github
          - web
      training_steps:
        description: Training steps to run automatically after intake
        required: true
        default: "100"
        type: string
      batch_size:
        description: Training batch size
        required: true
        default: "4"
        type: string
      license_ack:
        description: Confirm you have rights to use all selected text for model training
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read
  actions: write

concurrency:
  group: ivritlm-source-intake
  cancel-in-progress: false

jobs:
  intake:
    name: Build and store Hebrew corpus candidate
    env:
      PYTHONPATH: .
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out IvritLM
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install intake and Drive dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-intake.txt
          python -m pip install --disable-pip-version-check -r requirements-drive.txt

      - name: Validate authorization and Drive configuration
        env:
          LICENSE_ACK: ${{ inputs.license_ack }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          if os.environ.get("LICENSE_ACK") != "yes":
              raise SystemExit("Confirm that you have permission to use this source for training.")
          names = ["DRIVE_CLIENT_ID", "DRIVE_CLIENT_SECRET", "DRIVE_REFRESH_TOKEN", "DRIVE_FOLDER_ID"]
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Configure Google Drive repository secrets first: " + ", ".join(missing))
          PY

      - name: Inspect source and build Hebrew corpus candidate
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_KIND: ${{ inputs.source_kind }}
        run: python scripts/inspect_source.py

      - name: Upload corpus and provenance manifest to Google Drive
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/drive_storage.py upload-corpus

      - name: Automatically start training after successful corpus upload
        uses: actions/github-script@v7
        with:
          script: |
            const steps = Number("${{ inputs.training_steps }}");
            const batchSize = Number("${{ inputs.batch_size }}");
            if (!Number.isInteger(steps) || steps < 1 || steps > 1000) {
              core.setFailed("training_steps must be between 1 and 1000.");
              return;
            }
            if (!Number.isInteger(batchSize) || batchSize < 1 || batchSize > 16) {
              core.setFailed("batch_size must be between 1 and 16.");
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pretrain.yml",
              ref: "main",
              inputs: { corpus_path: "", steps: String(steps), batch_size: String(batchSize) }
            });
            core.info("Training workflow dispatched automatically after corpus upload.");

      - name: Upload intake report as a secondary copy
        uses: actions/upload-artifact@v4
        with:
          name: ivritlm-source-intake-${{ github.run_id }}
          path: artifacts/source-intake/
          if-no-files-found: error
          retention-days: 14

      - name: Report next step
        run: |
          echo "Hebrew corpus candidate and provenance were saved to Google Drive."
          echo "The corpus was uploaded successfully. Incremental training was started automatically."
